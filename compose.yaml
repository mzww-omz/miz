services:
  gateway:
    image: caddy:2.10-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile

  migrate:
    image: miz-api
    command: ["miz-migrate"]
    environment:
      DATABASE_URL: postgres://miz:miz@db:5432/miz
    depends_on:
      db:
        condition: service_healthy

  api:
    image: miz-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://miz:miz@db:5432/miz
      APP_ORIGIN: http://localhost:8080
      CURSOR_SIGNING_KEY: insecure-local-cursor-signing-key-change-me
      OPERATOR_MFA_ENCRYPTION_KEY: insecure-local-operator-mfa-key-change-me
      RUST_LOG: miz_api=debug,tower_http=debug
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "miz-api-healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 10

  db:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: miz
      POSTGRES_USER: miz
      POSTGRES_PASSWORD: miz
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miz -d miz"]
      interval: 5s
      timeout: 2s
      retries: 10

volumes:
  postgres-data:
